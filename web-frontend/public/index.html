<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="description" content="TokoKu - Aplikasi E-Commerce Multiplatform" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>TokoKu - E-Commerce</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: #f5f5f5;
        color: #333;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Loading spinner sebelum React mount */
      #initial-loader {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        gap: 16px;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 5px solid #e3f2fd;
        border-top-color: #1976d2;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #initial-loader p {
        color: #1976d2;
        font-size: 16px;
        font-weight: 500;
      }
    </style>
  </head>

  <body>
    <noscript>
      Kamu perlu mengaktifkan JavaScript untuk menjalankan aplikasi ini.
    </noscript>

    <!-- Loading awal sebelum React siap -->
    <div id="initial-loader">
      <div class="spinner"></div>
      <p>Memuat TokoKu...</p>
    </div>

    <!-- React akan mount di sini -->
    <div id="root"></div>

    <script>
      // Sembunyikan loader setelah React mount
      window.addEventListener('load', function () {
        const loader = document.getElementById('initial-loader');
        if (loader) loader.style.display = 'none';
      });
    </script>
  </body>
</html>
